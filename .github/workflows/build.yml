name: Build Cyber Iraq APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-user-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        working-directory: cyber-iraq-app
        run: flutter pub get
      - name: Analyze
        working-directory: cyber-iraq-app
        run: flutter analyze
      - name: Test
        working-directory: cyber-iraq-app
        run: flutter test
      - name: Build release APK
        working-directory: cyber-iraq-app
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-iraq-app-release.apk
          path: cyber-iraq-app/build/app/outputs/flutter-apk/app-release.apk

  build-admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - name: Install dependencies
        working-directory: cyber-iraq-admin
        run: flutter pub get
      - name: Analyze
        working-directory: cyber-iraq-admin
        run: flutter analyze
      - name: Test
        working-directory: cyber-iraq-admin
        run: flutter test
      - name: Build release APK
        working-directory: cyber-iraq-admin
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-iraq-admin-release.apk
          path: cyber-iraq-admin/build/app/outputs/flutter-apk/app-release.apk
